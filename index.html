<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>停车导航 - 维也纳酒店</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #1a365d;
            --primary-light: #2c5282;
            --accent: #d4a056;
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #1a202c;
            --text-light: #718096;
            --border: #e2e8f0;
            --success: #48bb78;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 24px rgba(26, 54, 93, 0.2);
            font-size: 28px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-light);
        }

        .route-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .route-point {
            padding: 16px 20px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .route-point:first-child {
            border-bottom: 1px dashed var(--border);
        }

        .point-marker {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        .point-marker.start {
            background: linear-gradient(135deg, var(--accent), #e6b980);
            color: white;
        }

        .point-marker.end {
            background: linear-gradient(135deg, var(--success), #68d391);
            color: white;
        }

        .point-info { flex: 1; }

        .point-label {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 2px;
        }

        .point-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 2px;
        }

        .point-address {
            font-size: 13px;
            color: var(--text-light);
        }

        .distance-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            background: var(--bg);
            margin: 0 20px 16px;
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-light);
        }

        .distance-badge strong { color: var(--primary); }

        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-gaode {
            background: linear-gradient(135deg, #00a870, #00c880);
            color: white;
            box-shadow: 0 4px 16px rgba(0, 168, 112, 0.3);
        }

        .btn-tencent {
            background: linear-gradient(135deg, #1a8cff, #3da3ff);
            color: white;
            box-shadow: 0 4px 16px rgba(26, 140, 255, 0.3);
        }

        .btn-baidu {
            background: linear-gradient(135deg, #2932e1, #4c5aff);
            color: white;
            box-shadow: 0 4px 16px rgba(41, 50, 225, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tips {
            margin-top: auto;
            padding-top: 20px;
        }

        .tip-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 13px;
            color: var(--text-light);
            padding: 10px 12px;
            background: var(--card);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .tip-item svg {
            width: 16px;
            height: 16px;
            fill: var(--accent);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .footer {
            text-align: center;
            padding: 20px 0 8px;
            font-size: 12px;
            color: var(--text-light);
        }

        .footer-logo {
            font-weight: 600;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-icon">🚗</div>
            <h1>停车导航</h1>
            <p>维也纳酒店 · 西湖公园店</p>
        </header>

        <div class="route-card">
            <div class="route-point">
                <div class="point-marker start">A</div>
                <div class="point-info">
                    <div class="point-label">出发地</div>
                    <div class="point-name">维也纳酒店（岳麓山橘子洲西湖公园店）</div>
                    <div class="point-address">枫林一路423号</div>
                </div>
            </div>

            <div class="route-point">
                <div class="point-marker end">B</div>
                <div class="point-info">
                    <div class="point-label">目的地</div>
                    <div class="point-name">力力小院停车场</div>
                    <div class="point-address">枫林一路479号</div>
                </div>
            </div>

            <div class="distance-badge">
                📍 约 <strong>500米</strong> · 预计 <strong>2分钟</strong>
            </div>
        </div>

        <div class="nav-buttons">
            <a href="https://uri.amap.com/navigation?to=湖南省长沙市岳麓区枫林一路479号力力小院停车场&mode=car&policy=1&src=vienna_hotel" class="btn btn-gaode" target="_blank">
                <div class="btn-icon">🗺️</div>
                高德地图导航
            </a>
            <a href="https://apis.map.qq.com/uri/v1/routeplan?type=drive&to=湖南省长沙市岳麓区枫林一路479号力力小院停车场&policy=0&referer=vienna_hotel" class="btn btn-tencent" target="_blank">
                <div class="btn-icon">🧭</div>
                腾讯地图导航
            </a>
            <a href="https://api.map.baidu.com/direction?destination=湖南省长沙市岳麓区枫林一路479号力力小院停车场&mode=driving&src=vienna_hotel&output=html&coord_type=gc02" class="btn btn-baidu" target="_blank">
                <div class="btn-icon">📍</div>
                百度地图导航
            </a>
        </div>

        <div class="tips">
            <div class="tip-item">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                <span>出酒店右转，沿枫林一路直行约500米即到</span>
            </div>
            <div class="tip-item">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                <span>停车场位于西湖二三管区，酒店东北方向</span>
            </div>
        </div>

        <footer class="footer">
            <span class="footer-logo">维也纳酒店</span> · 宾至如归
        </footer>
    </div>
</body>
</html>
